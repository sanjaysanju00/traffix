<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Smart Traffic</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body>


<div class="container">

    <h1>🔐 Login</h1>


    {% if error %}

        <div class="error">

            {{ error }}

        </div>

    {% endif %}


    <form method="POST">


        <input
            type="email"
            name="email"
            placeholder="Email"
            required
        >


        <div class="password-box">

            <input
                type="password"
                id="loginPassword"
                name="password"
                placeholder="Password"
                required
            >


            <button
                type="button"
                class="show-password"
                onclick="togglePassword(
                    'loginPassword',
                    this
                )"
            >
                👁️
            </button>

        </div>


        <button type="submit">

            Login

        </button>


    </form>


    <p>

        Don't have an account?

        <a href="{{ url_for('register') }}">

            Register

        </a>

    </p>


</div>


<script>

function togglePassword(
    passwordId,
    button
) {

    const password =
        document.getElementById(
            passwordId
        );


    if (
        password.type === "password"
    ) {

        password.type = "text";

        button.innerText = "🙈";

    }

    else {

        password.type = "password";

        button.innerText = "👁️";

    }

}

</script>


</body>

</html>
