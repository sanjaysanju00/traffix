<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link
        rel="manifest"
        href="{{ url_for('static', filename='manifest.json') }}"
    >

    <meta
        name="theme-color"
        content="#0d6efd"
    >

    <title>Smart Traffic</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body>


<div class="container">


    <h1>
        🚦 Smart Traffic
    </h1>


    <h2>
        Smart Traffic Detection and
        Alternate Route Suggestion System
    </h2>


    <p>
        Detect traffic conditions, receive
        traffic alerts and find alternate routes.
    </p>


    <div class="buttons">

        <a href="{{ url_for('login') }}">
            🔐 Login
        </a>


        <a href="{{ url_for('register') }}">
            📝 Register
        </a>

    </div>


</div>


<script>

if ("serviceWorker" in navigator) {

    window.addEventListener(
        "load",
        function () {

            navigator.serviceWorker.register(
                "/firebase-messaging-sw.js"
            )

            .then(
                function (registration) {

                    console.log(
                        "✅ Smart Traffic service worker registered:",
                        registration.scope
                    );

                }
            )

            .catch(
                function (error) {

                    console.error(
                        "❌ Service worker registration failed:",
                        error
                    );

                }
            );

        }
    );

}

</script>


</body>

</html>
